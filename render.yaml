services:
  - type: web
    name: smart-panchayat-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false   # Optional
      - key: FIREBASE_PROJECT_ID
        sync: false   # Optional
      - key: FIREBASE_CLIENT_EMAIL
        sync: false   # Optional
      - key: FIREBASE_PRIVATE_KEY
        sync: false   # Optional
      - key: ESCALATION_DAYS
        value: 7
      - key: FRONTEND_URL
        value: "*"
